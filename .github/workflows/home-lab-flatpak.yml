name: Cartuchos Home Lab Flatpak
on:
  push:
    branches: [home-lab]
    tags: ['home-lab-v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flatpak:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-49
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6.5
        with:
          bundle: Cartuchos-Home-Lab-x86_64.flatpak
          manifest-path: build-aux/flatpak/io.github.alexisrocca.CartuchosHomeLab.json

  release:
    if: startsWith(github.ref, 'refs/tags/home-lab-v')
    needs: flatpak
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: '*'
          merge-multiple: true
      - name: Publish Flatpak
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" Cartuchos-Home-Lab-x86_64.flatpak --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
